<!DOCTYPE html>
<html>
    <head>
        <title>Calculator App</title>
    </head>
    <body>
        <h1>Calculator App</h1>
        <label for="num1">First Number:</label>
        <input type ="number"id="num1"><br><br>
         <label for="num2">Second Number:</label>
        <input type ="number"id="num2"><br><br>
        <button onclick="Addition()">Addition</button>
        <p id="add">Addition:</p>
        <button onclick="Substraction()">Substraction</button>
        <p id="sub">Substraction</p>
        <button onclick="Multiplication()">Multiplication</button>
        <p id="mul">Multiplication</p>
        <button onclick="Division()">Division</button>
        <p id="div">Division</p>
        <button onclick="Modulo()">Modulo</button>
        <p id="mod">Modulo</p>
        <button onclick="Max()">Max Number</button>
        <p id="max">Max Number:</p>
        <button onclick="Print()">Print Numbers</button>
        <p id="print">Print Numbers:</p>
        <script>
            function Addition(){
                let a=Number(document.getElementById("num1").value);
                let b=Number(document.getElementById("num2").value);
                let res=a+b;
                document.getElementById("add").innerText=`Addition:${res}`;
            }
            function Substraction(){
                let a=Number(document.getElementById("num1").value);
                let b=Number(document.getElementById("num2").value);
                let res=a-b;
                document.getElementById("sub").innerText=`Substraction:${res}`;
            }
            function Multiplication(){
                let a=Number(document.getElementById("num1").value);
                let b=Number(document.getElementById("num2").value);
                let res=a*b;
                document.getElementById("mul").innerText=`Multiplication:${res}`;
            }
            function Division(){
                let a=Number(document.getElementById("num1").value);
                let b=Number(document.getElementById("num2").value);
                let res=a/b;
                document.getElementById("div").innerText=`Division:${res}`;
            }
            function Modulo(){
                let a=Number(document.getElementById("num1").value);
                let b=Number(document.getElementById("num2").value);
                let res=a%b;
                document.getElementById("mod").innerText=`Modulo:${res}`;
            }
            function Max(){
                let a=Number(document.getElementById("num1").value);
                let b=Number(document.getElementById("num2").value);
                if(a>b){
                    document.getElementById("max").innerText=`Max Number:${a}`;
                
                }
                else
                    document.getElementById("max").innerText=`Max Number:${b}`;
            }
                
            function Print(){

                let a=Number(document.getElementById("num1").value);
                let b=Number(document.getElementById("num2").value);
                let result="";
        
                     for(let i=a;i<=b;i++){
                        result+=i+"<br>";
                     }
                        document.getElementById("print").innerHTML="Print Numbers:<br>"+result;
                     
                     
                }
            


        </script>
    </body>
</html>
