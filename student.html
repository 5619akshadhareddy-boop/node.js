<!DOCTYPE html>
<html>
<head>
    <title>Student Details Form</title>
</head>
<body>

<h1>4. Student Details Form</h1>
 <div>
    <h2>4. Interactive Data Collection Form</h2>
    <form action="index.html" method="POST">
      

<form>

    <label>Name (Text Input):</label>
    <input type="text" placeholder="Enter your full name">
    <br><br>

    <label>Email Input:</label>
    <input type="email" placeholder="name@example.com">
    <br><br>

    <label>Password Input:</label>
    <input type="password" placeholder="Enter secure password">
    <br><br>

    <label>Gender (Choose One):</label>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    <label>Select Course:</label>
    <select>
        <option>Select Course</option>
        <option>DS</option>
        <option>AIML</option>
        <option>Cyber</option>
        <option>Data Science</option>
        <option>Civil</option>
    </select>
    <br><br>

    <label>Comments (Textarea):</label><br>
    <textarea rows="5" cols="40" placeholder="Write your message here..."></textarea>
    <br><br>

    <input type="submit" value="Submit Form Data">

</form>

</body>
</html>
